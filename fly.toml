app = "lp-tracker-pessoal"
primary_region = "gru"

[build]

[env]
  DB_PATH = "/data/pools.db"

[http_service]
  internal_port = 8504
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "pools_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
